spring.application.name=pesonary-wallet-api

# Database Configurations
spring.datasource.url=jdbc:mysql://localhost:3306/wallet_db?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:yourLocalPassword}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Actuator Configuration
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# JSON Web Token
app.jwt.secret=${JWT_SECRET:placeholder-change-me-to-a-string-of-32-bytes}
app.jwt.expiration-ms=3600000